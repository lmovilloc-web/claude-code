# PortalFork.cl — agentes propios (independientes de Genesis; comparten solo
# el VPS). Todo corre EN el VPS via systemd; los modelos van por API con DPA
# (Anthropic/OpenAI). Ver COMPLIANCE.md para la politica de modelos chinos
# (solo auto-hospedados, y hoy NO estan en el camino por defecto).
#
# Cada agente define:
#   instructions_file -> su "soul" versionada en souls/
#   skills            -> herramientas propias (menor privilegio, ver skills.py)
#   security          -> medidas propias, aplicadas por server.py

providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY

  openai:
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  # Alternativa local en el VPS (Ollama) si algun dia quieres costo cero:
  # ollama: {kind: openai, base_url: "http://localhost:11434/v1", api_key: ollama}

entry_agent: router

run:
  max_turns: 10
  global_token_budget: 80000

agents:
  router:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 400
    token_budget: 3000
    handoffs: [soporte, prospector, analista]
    instructions_file: souls/router.md
    skills: []
    security:
      public: true            # es la puerta de entrada del portal
      rate_per_hour: 60
      max_input_chars: 3000

  soporte:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 1024
    token_budget: 12000
    handoffs: []
    instructions_file: souls/soporte.md
    skills: [crear_ticket, registrar_supresion]
    security:
      public: true
      rate_per_hour: 30
      max_input_chars: 4000

  prospector:
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 2048
    token_budget: 20000
    handoffs: []
    instructions_file: souls/prospector.md
    skills: [buscar_leads]
    security:
      public: false           # interno: requiere X-PortalFork-Token
      rate_per_hour: 20
      max_input_chars: 6000

  analista:
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 2048
    token_budget: 20000
    handoffs: []
    instructions_file: souls/analista.md
    skills: [leer_extractos, estado_ocs]
    security:
      public: false           # interno: requiere X-PortalFork-Token
      rate_per_hour: 20
      max_input_chars: 6000
